name: Folder explorer once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/folder-explorer-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply folder explorer update
        run: python .github/scripts/folder_explorer_update.py
      - name: Check JavaScript
        run: |
          node --check js/app-v3.js
          node --check js/backend-v3.js
      - name: Commit changes
        run: |
          git config user.name "ProfLarsSchnyder"
          git config user.email "lars.schnyder1@gmail.com"
          git add js/app-v3.js js/backend-v3.js index.html styles-v3.css
          git commit -m "Add desktop style game folders"
          git push
