name: Patch faster game flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-faster-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch intro and correct-answer flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/game-v2.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ("    introReady: false,", "    introReady: true,"),
              ("  $('#intro-audio-status').textContent = 'Das Intro läuft ...';", "  $('#intro-audio-status').textContent = 'Das Intro läuft. Du kannst jederzeit starten.';"),
              ("  $('#begin-questions').disabled = true;", "  $('#begin-questions').disabled = false;"),
              ("  $('#begin-questions').classList.remove('ready');", "  $('#begin-questions').classList.add('ready');"),
              ("""  await playCue(cue);\n  if (seq !== S.seq || S.finished) return;\n\n  if (S.i >= S.qs.length - 1 || S.i >= 14) finish(true);\n  else $('#next-question').classList.remove('hidden');""",
               """  const isFinalQuestion = S.i >= S.qs.length - 1 || S.i >= 14;\n  if (!isFinalQuestion) {\n    $('#next-question').classList.remove('hidden');\n    playCue(cue);\n    return;\n  }\n\n  await playCue(cue);\n  if (seq === S.seq && !S.finished) finish(true);""")
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected snippet not found: {old[:80]!r}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/game-v2.js
          git diff --cached --quiet && exit 0
          git commit -m "Allow skipping intro and speed up next question"
          git push
