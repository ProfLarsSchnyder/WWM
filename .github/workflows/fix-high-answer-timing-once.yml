name: Fix high answer timing once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-high-answer-timing-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix_high_answer.py
      - name: Syntax check
        run: node --check js/app-v3.js && node --check js/audio.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-v3.js
          git commit -m "Fix answer reveal from 32000 upwards"
          git push
