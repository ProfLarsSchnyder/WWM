name: Apply WWM timing adjustments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wwm-timing-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch answer and joker timings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/app-v3.js')
          s = path.read_text(encoding='utf-8')

          # Fixed reveal delays by prize level.
          anchor = "function selectAnswer(key) {"
          timing_fn = '''function answerRevealDelay(index) {\n  if (index <= 4) return 1000;      // 50–500\n  if (index <= 8) return 1500;      // 1'000–8'000\n  if (index === 9) return 2000;     // 16'000\n  if (index === 10) return 2500;    // 32'000\n  if (index === 11) return 3000;    // 64'000\n  if (index === 12) return 3500;    // 125'000\n  if (index === 13) return 4500;    // 500'000\n  return 6000;                       // 1'000'000\n}\n\n'''
          if timing_fn.strip() not in s:
              if anchor not in s:
                  raise SystemExit('selectAnswer anchor not found')
              s = s.replace(anchor, timing_fn + anchor, 1)

          old = '''  if (state.play.index >= 10) {\n    stopLoop();\n    await playCue(state.play.index === 14 ? 'lock-million' : 'lock-high');\n  } else {\n    await sleep(1250);\n  }\n\n  if (seq !== state.playSeq || state.play.finished) return;'''
          new = '''  const revealDelay = answerRevealDelay(state.play.index);\n\n  // Higher levels get their suspense cue, but the visual reveal is controlled\n  // by a fixed show timing instead of waiting for the whole audio file.\n  if (state.play.index >= 10) {\n    stopLoop();\n    playCue(state.play.index === 14 ? 'lock-million' : 'lock-high');\n  }\n\n  await sleep(revealDelay);\n\n  if (seq !== state.playSeq || state.play.finished) return;'''
          if old not in s:
              raise SystemExit('lockAnswer timing block not found')
          s = s.replace(old, new, 1)

          # Audience: the joker MP3 itself supplies the transition sound.
          old = '''  stopForeground();\n  playCue('lifeline-ping');\n  const packet = await resultPromise;'''
          if old not in s:
              raise SystemExit('audience ping block not found')
          s = s.replace(old, '''  // Keep the audience MP3 running: its own transition sound is timed to the reveal.\n  const packet = await resultPromise;''', 1)

          # Phone: same principle, no extra synthetic/standalone ping.
          old = '''  stopForeground();\n  playCue('lifeline-ping');\n\n  const packet = await resultPromise;'''
          if old not in s:
              raise SystemExit('phone ping block not found')
          s = s.replace(old, '''  // Keep the phone MP3 running into the final tip; no extra ping is added.\n\n  const packet = await resultPromise;''', 1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check js/app-v3.js && node --check js/audio.js && node --check js/backend-v3.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-v3.js
          git diff --cached --quiet && exit 0
          git commit -m "Tune WWM answer reveal and joker audio timing"
          git push
