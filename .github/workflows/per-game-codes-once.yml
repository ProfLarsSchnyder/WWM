name: Per game codes once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/per-game-codes-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply per-game code update
        run: python .github/scripts/per_game_codes_patch.py
      - name: Check JavaScript
        run: node --check js/app-v3.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-v3.js index.html supabase/schema.sql supabase/per-game-codes-update.sql
          git commit -m "Use permanent codes for every WWM game"
          git push
