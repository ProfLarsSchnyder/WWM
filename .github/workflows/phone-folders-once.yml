name: Phone and folders once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phone-folders-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply phone and folder update
        run: python .github/scripts/phone_folders_patch.py
      - name: Check JavaScript
        run: node --check js/app-v3.js
      - name: Commit changes
        run: |
          git config user.name "ProfLarsSchnyder"
          git config user.email "lars.schnyder1@gmail.com"
          git add js/app-v3.js index.html styles-v3.css
          git commit -m "Add game folders and smarter phone joker dialogue"
          git push
