name: Fix backend cache once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-backend-cache-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply backend cache fix
        run: python .github/scripts/fix_backend_cache.py
      - name: Check JavaScript
        run: |
          node --check js/app-v3.js
          node --check js/backend-v3.js
      - name: Commit changes
        run: |
          git config user.name "ProfLarsSchnyder"
          git config user.email "lars.schnyder1@gmail.com"
          git add js/app-v3.js index.html
          git commit -m "Fix cached backend module loading"
          git push
