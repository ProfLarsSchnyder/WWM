name: Apply exact joker audio segments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wwm-joker-segments-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo ' ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Syntax check
        run: node --check js/audio.js && node --check js/app-v3.js
      - name: Commit exact timing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/audio.js js/app-v3.js
          git diff --cached --quiet && exit 0
          git commit -m "Use exact audience and phone audio segments"
          git push
