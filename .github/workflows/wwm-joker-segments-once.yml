name: Apply exact joker audio segments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wwm-joker-segments-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact audio segments and countdowns
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          audio_path = Path('js/audio.js')
          audio = audio_path.read_text(encoding='utf-8')
          audio = audio.replace('const ASSET_VERSION = "2026-09-23-v7";', 'const ASSET_VERSION = "2026-09-23-v8";')

          anchor = 'export function playClip(name, options = {}) { return playCue(name, options); }'
          if 'export function playCueSegment(' not in audio:
              segment_fn = r'''export function playCueSegment(name, startAt, endAt, { replace = true } = {}) {
  if (!enabled) return Promise.resolve({ ended: false, reason: "disabled" });
  const audio = clips.get(name);
  if (!audio) return Promise.resolve({ ended: false, reason: "missing" });

  const start = Math.max(0, Number(startAt) || 0);
  const end = Math.max(start, Number(endAt) || start);
  if (replace) stopForeground();

  const token = ++foregroundToken;
  foreground = audio;

  return new Promise(resolve => {
    let settled = false;
    let timer = null;

    const cleanup = () => {
      if (timer) clearTimeout(timer);
      audio.removeEventListener("ended", onEnded);
      audio.removeEventListener("error", onError);
    };

    const done = reason => {
      if (settled) return;
      settled = true;
      cleanup();
      if (reason === "segment-end") audio.pause();
      if (foreground === audio && token === foregroundToken) foreground = null;
      if (foregroundDone === cancel) foregroundDone = null;
      resolve({ ended: reason === "segment-end" || reason === "ended", reason });
    };

    const cancel = reason => done(reason || "stopped");
    const onEnded = () => done("ended");
    const onError = () => done("error");

    foregroundDone = cancel;
    audio.addEventListener("ended", onEnded, { once: true });
    audio.addEventListener("error", onError, { once: true });

    const startPlayback = async () => {
      try {
        if (audio.readyState < 1) {
          await new Promise((resolveMetadata, rejectMetadata) => {
            const ready = () => { cleanupMetadata(); resolveMetadata(); };
            const failed = () => { cleanupMetadata(); rejectMetadata(new Error('metadata')); };
            const cleanupMetadata = () => {
              audio.removeEventListener('loadedmetadata', ready);
              audio.removeEventListener('error', failed);
            };
            audio.addEventListener('loadedmetadata', ready, { once: true });
            audio.addEventListener('error', failed, { once: true });
            audio.load();
          });
        }

        audio.currentTime = start;
        await audio.play();
        unlocked = true;

        const durationMs = Math.max(0, (end - start) * 1000);
        timer = window.setTimeout(() => {
          if (token !== foregroundToken) return done("stopped");
          try { audio.currentTime = end; } catch {}
          done("segment-end");
        }, durationMs);
      } catch (error) {
        console.warn(`Audioabschnitt ${name} konnte nicht gestartet werden.`, error);
        done("blocked");
      }
    };

    startPlayback();
  });
}

'''
              if anchor not in audio:
                  raise SystemExit('playClip anchor missing')
              audio = audio.replace(anchor, segment_fn + anchor, 1)

          audio_path.write_text(audio, encoding='utf-8')

          app_path = Path('js/app-v3.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace(
              '  playCue, startLoop, stopAll, stopLoop, stopForeground,\n',
              '  playCue, playCueSegment, startLoop, stopAll, stopLoop, stopForeground,\n',
              1
          )

          audience_pattern = re.compile(r"async function useAudience\(seq\) \{.*?\n\}\n\nfunction audienceBars", re.S)
          audience_replacement = r'''async function useAudience(seq) {
  const resultPromise = jokerResult('audience').then(result => ({ result }), error => ({ error }));
  const audioPromise = playCueSegment('joker-audience', 26, 32);

  modal(`
    <div class="joker-phase compact-joker-phase">
      <div class="phase-icon">👥</div>
      <h3>Publikumsjoker</h3>
      <div class="phase-copy">Das Publikum stimmt ab.</div>
      <div class="audience-stage"><div class="audience-live-bars"><span></span><span></span><span></span><span></span></div></div>
      <div class="joker-clock joker-countdown"><strong>6</strong> Sekunden</div>
    </div>`, true);

  for (let remaining = 6; remaining >= 1; remaining--) {
    const clock = document.querySelector('.joker-countdown strong');
    if (clock) clock.textContent = String(remaining);
    await sleep(1000);
    if (seq !== state.playSeq) return;
  }

  await audioPromise;
  if (seq !== state.playSeq) return;
  const packet = await resultPromise;
  if (packet.error) throw packet.error;
  const percentages = packet.result.percentages || {};

  modal(`
    <div class="joker-result-pop">
      <div class="phase-icon">👥</div>
      <h3>Das Publikum hat gewählt</h3>
      <div class="audience-chart">${audienceBars(percentages)}</div>
      <div class="modal-actions"><button class="btn primary" data-modal="close-joker">Zurück zur Frage</button></div>
    </div>`, true);
}

function audienceBars'''
          app, n = audience_pattern.subn(audience_replacement, app, count=1)
          if n != 1:
              raise SystemExit('useAudience block missing')

          phone_pattern = re.compile(r"async function usePhone\(seq\) \{.*?\n\}\n\nfunction phonePhase\(text, clock\) \{.*?\n\}\n\nasync function useTeacher", re.S)
          phone_replacement = r'''async function usePhone(seq) {
  const resultPromise = jokerResult('phone').then(result => ({ result }), error => ({ error }));
  const audioPromise = playCueSegment('joker-phone', 20, 38);

  const thoughtFor = remaining => {
    if (remaining > 12) return '«Okay ... einen Moment. Ich gehe die Möglichkeiten im Kopf durch.»';
    if (remaining > 6) return '«Zwei Antworten wirken auf mich eher unwahrscheinlich. Ich versuche es einzugrenzen.»';
    return '«Ich habe jetzt eine klare Tendenz. Ich prüfe sie noch einmal kurz.»';
  };

  phonePhase(thoughtFor(18), 18);

  for (let remaining = 18; remaining >= 1; remaining--) {
    if ([12, 6].includes(remaining)) phonePhase(thoughtFor(remaining), remaining);
    const clock = document.querySelector('.joker-countdown strong');
    if (clock) clock.textContent = String(remaining);
    await sleep(1000);
    if (seq !== state.playSeq) return;
  }

  await audioPromise;
  if (seq !== state.playSeq) return;
  const packet = await resultPromise;
  if (packet.error) throw packet.error;
  const result = packet.result;

  modal(`
    <div class="joker-result-pop">
      <div class="phase-icon">☎</div>
      <h3>Der Tipp</h3>
      <div class="phone-process final-phone-tip">«Ich würde <strong>${escapeHtml(String(result.guessKey || '').toUpperCase())}</strong> nehmen. Ich bin ungefähr zu <strong>${Number(result.confidence || 0)}%</strong> sicher.»</div>
      <div class="modal-actions"><button class="btn primary" data-modal="close-joker">Zurück zur Frage</button></div>
    </div>`, true);
}

function phonePhase(text, remaining) {
  modal(`
    <div class="joker-phase">
      <div class="phase-icon">☎</div>
      <h3>Telefonjoker</h3>
      <div class="phone-process">${text}</div>
      <div class="joker-clock joker-countdown"><strong>${remaining}</strong> Sekunden</div>
    </div>`, true);
}

async function useTeacher'''
          app, n = phone_pattern.subn(phone_replacement, app, count=1)
          if n != 1:
              raise SystemExit('usePhone block missing')

          app_path.write_text(app, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check js/audio.js && node --check js/app-v3.js
      - name: Commit exact timing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/audio.js js/app-v3.js
          git diff --cached --quiet && exit 0
          git commit -m "Use exact audience and phone audio segments"
          git push
