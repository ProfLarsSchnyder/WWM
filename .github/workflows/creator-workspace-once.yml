name: Creator workspace once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/creator-workspace-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply creator workspace update
        run: python .github/scripts/creator_workspace_update.py
      - name: Check JavaScript
        run: |
          node --check js/app-core-v3.js
          node --check js/access-ui-v4.js
          node --check js/backend-v3.js
          node --check js/app-v3.js
      - name: Commit changes
        run: |
          git config user.name "ProfLarsSchnyder"
          git config user.email "lars.schnyder1@gmail.com"
          git add js/app-core-v3.js js/access-ui-v4.js js/backend-v3.js js/app-v3.js index.html styles-v3.css
          git commit -m "Add creator workspaces and coloured folders"
          git push
