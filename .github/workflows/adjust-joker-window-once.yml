name: Adjust joker audio windows once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-joker-window-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust joker timing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/app-v3.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ("playCueSegment('joker-audience', 26, 33)", "playCueSegment('joker-audience', 26, 32.5)"),
              ("playCueSegment('joker-phone', 20, 39)", "playCueSegment('joker-phone', 21, 40)"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old}')
              text = text.replace(old, new, 1)

          old_loop = """  for (let remaining = 7; remaining >= 1; remaining--) {
    const clock = document.querySelector('.joker-countdown strong');
    if (clock) clock.textContent = String(remaining);
    await sleep(1000);
    if (seq !== state.playSeq) return;
  }
"""
          new_loop = """  for (let remaining = 7; remaining >= 1; remaining--) {
    const clock = document.querySelector('.joker-countdown strong');
    if (clock) clock.textContent = String(remaining);
    await sleep(remaining === 1 ? 500 : 1000);
    if (seq !== state.playSeq) return;
  }
"""
          if old_loop not in text:
              raise SystemExit('Audience countdown loop not found')
          text = text.replace(old_loop, new_loop, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check js/app-v3.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-v3.js
          git commit -m "Fine tune audience and phone joker audio windows"
          git push
