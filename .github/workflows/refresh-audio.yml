name: Refresh WWM audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download working MP3 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          PAGEBASE='https://downloads.khinsider.com/game-soundtracks/album/who-wants-to-be-a-millionaire-the-album'

          get_track() {
            page="$1"
            target="$2"
            html="$(curl -L --fail --retry 3 --silent --show-error "$PAGEBASE/$page")"
            url="$(printf '%s' "$html" | grep -o 'https://[^\"]*\.mp3' | grep 'vgmtreasurechest.com' | head -n 1)"
            if [ -z "$url" ]; then
              echo "No MP3 URL found for $page" >&2
              exit 1
            fi
            curl -L --fail --retry 3 --silent --show-error "$url" -o "assets/audio/$target"
          }

          get_track '01%20Main%20Theme.mp3' intro.mp3
          get_track '11%20%24100-%241%2C000%20Questions.mp3' question-low.mp3
          get_track '29%20%2416%2C000%20Question.mp3' question-mid.mp3
          get_track '34%20%2432%2C000%20Question.mp3' question-32000.mp3
          get_track '39%20%2464%2C000%20Question.mp3' question-64000.mp3
          get_track '44%20%24125%2C000%20Question.mp3' question-125000.mp3
          get_track '54%20%24500%2C000%20Question.mp3' question-500000.mp3
          get_track '59%20%241%2C000%2C000%20Question.mp3' question-million.mp3
          get_track '35%20%2432%2C000%20Final%20Answer-.mp3' final-answer-high.mp3
          get_track '60%20%241%2C000%2C000%20Final%20Answer-.mp3' final-answer-million.mp3
          get_track '17%20%242%2C000%20Win.mp3' correct-low.mp3
          get_track '37%20%2432%2C000%20Win.mp3' correct-high.mp3
          get_track '62%20%241%2C000%2C000%20Win.mp3' correct-million.mp3
          get_track '36%20%2432%2C000%20Lose.mp3' wrong.mp3
          get_track '61%20%241%2C000%2C000%20Lose.mp3' wrong-million.mp3
          get_track '12%20Win%20%241%2C000.mp3' safe-1.mp3
          get_track '32%20%2416%2C000%20Win.mp3' safe-2.mp3
          get_track '67%2050-50.mp3' joker-5050.mp3
          get_track '68%20Ask%20The%20Audience.mp3' joker-audience.mp3
          get_track '66%20Phone-A-Friend.mp3' joker-phone.mp3
          get_track '65%20Lifeline%20Pings.mp3' lifeline-ping.mp3
          get_track '63%20Closing%20Theme.mp3' outro.mp3

          test "$(stat -c%s assets/audio/question-32000.mp3)" -gt 1000000
          test "$(stat -c%s assets/audio/joker-5050.mp3)" -gt 100000

      - name: Commit refreshed audio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          if git diff --cached --quiet; then
            echo "Audio already up to date"
            exit 0
          fi
          git commit -m "Refresh working WWM audio assets"
          git push
