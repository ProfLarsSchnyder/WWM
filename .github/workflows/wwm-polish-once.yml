name: Polish WWM gameplay once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wwm-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gameplay and visual polish
        run: |
          echo 'CmltcG9ydCByZQpmcm9tIHBhdGhsaWIgaW1wb3J0IFBhdGgK' >/tmp/placeholder
      - name: Decode patch
        run: |
          echo '__BASE64__' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Syntax check
        run: node --check js/app-v3.js && node --check js/audio.js && node --check js/backend-v3.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app-v3.js js/audio.js styles-v3.css
          git diff --cached --quiet && exit 0
          git commit -m "Polish WWM layout jokers winner and hosting code"
          git push
".replace("__BASE64__