name: Polish WWM gameplay once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wwm-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gameplay and visual polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('js/app-v3.js')
          s = app.read_text(encoding='utf-8')

          # Hosting code presentation action
          old = "  if (action === 'host-refresh') return refreshDashboard();\n  if (action === 'host-stop') return stopHosting();"
          new = "  if (action === 'host-refresh') return refreshDashboard();\n  if (action === 'host-code-big') return showHostCode();\n  if (action === 'host-stop') return stopHosting();"
          if old not in s:
              raise SystemExit('host action anchor not found')
          s = s.replace(old, new, 1)

          anchor = "async function openDashboard() {"
          if anchor not in s:
              raise SystemExit('openDashboard anchor not found')
          host_fn = r'''function showHostCode() {
  const code = $('#host-join-code').textContent.trim() || '------';
  const title = $('#host-title').textContent.trim() || $('#host-game-name').textContent.trim() || 'Gehostetes Spiel';
  modal(`
    <div class="code-presenter-modal">
      <div class="code-presenter-label">Spielcode</div>
      <div class="code-presenter-code">${escapeHtml(code)}</div>
      <div class="code-presenter-title">${escapeHtml(title)}</div>
      <div class="code-presenter-hint">Lernendenmodus öffnen · Name und Klasse eingeben · Code verwenden</div>
      <div class="modal-actions">
        <button class="btn" data-action="fullscreen">Vollbild</button>
        <button class="btn primary" data-modal="close">Schliessen</button>
      </div>
    </div>`, false, true);
}

'''
          s = s.replace(anchor, host_fn + anchor, 1)

          # 50:50 should unblock answers immediately after the visual reveal, not after audio ends.
          pattern = re.compile(r"async function useFifty\(seq\) \{.*?\n\}\n\nfunction localAudiencePercentages", re.S)
          replacement = r'''async function useFifty(seq) {
  const result = await jokerResult('fifty');
  const cue = playCue('joker-fifty');
  await sleep(isAudioEnabled() ? 1050 : 120);
  if (seq !== state.playSeq) return;
  for (const key of result.removedKeys || []) document.querySelector(`.answer[data-key="${key}"]`)?.classList.add('removed');
  if ((result.removedKeys || []).includes(state.play.selected)) {
    state.play.selected = null;
    $$('.answer').forEach(answer => answer.classList.remove('selected'));
    $('#lock-answer').disabled = true;
  }
  $('#game-status').textContent = '50:50 Joker eingesetzt';
  state.jokerBusy = false;

  // The cue may continue, but the candidate can already select an answer.
  cue.then(async () => {
    if (seq !== state.playSeq || !state.play || state.play.locked || state.play.finished || state.jokerBusy) return;
    await resumeLoop();
  });
}

function localAudiencePercentages'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('useFifty block not found')
          s = s2

          # Audience: five seconds of voting, then the requested ping and immediate result.
          pattern = re.compile(r"async function useAudience\(seq\) \{.*?\n\}\n\nfunction audienceBars", re.S)
          replacement = r'''async function useAudience(seq) {
  const resultPromise = jokerResult('audience').then(result => ({ result }), error => ({ error }));
  playCue('joker-audience');
  modal(`
    <div class="joker-phase compact-joker-phase">
      <div class="phase-icon">👥</div>
      <h3>Publikumsjoker</h3>
      <div class="phase-copy">Das Publikum stimmt ab.</div>
      <div class="audience-stage"><div class="audience-live-bars"><span></span><span></span><span></span><span></span></div></div>
      <div class="joker-clock joker-countdown"><strong>5</strong> Sekunden</div>
    </div>`, true);

  for (let remaining = 4; remaining >= 1; remaining--) {
    await sleep(1000);
    if (seq !== state.playSeq) return;
    const clock = document.querySelector('.joker-countdown strong');
    if (clock) clock.textContent = String(remaining);
  }
  await sleep(1000);
  if (seq !== state.playSeq) return;

  stopForeground();
  playCue('lifeline-ping');
  const packet = await resultPromise;
  if (packet.error) throw packet.error;
  const percentages = packet.result.percentages || {};
  modal(`
    <div class="joker-result-pop">
      <div class="phase-icon">👥</div>
      <h3>Das Publikum hat gewählt</h3>
      <div class="audience-chart">${audienceBars(percentages)}</div>
      <div class="modal-actions"><button class="btn primary" data-modal="close-joker">Zurück zur Frage</button></div>
    </div>`, true);
}

function audienceBars'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('useAudience block not found')
          s = s2

          # Phone: start immediately, 18 second thought process, ping, final tip.
          pattern = re.compile(r"async function usePhone\(seq\) \{.*?\n\}\n\nfunction phonePhase", re.S)
          replacement = r'''async function usePhone(seq) {
  const resultPromise = jokerResult('phone').then(result => ({ result }), error => ({ error }));
  playCue('joker-phone');
  phonePhase('«Okay ... einen Moment. Ich gehe die Möglichkeiten im Kopf durch.»', '18 Sekunden zum Nachdenken');

  await sleep(6000);
  if (seq !== state.playSeq) return;
  phonePhase('«Zwei Antworten wirken auf mich eher unwahrscheinlich. Ich versuche es einzugrenzen.»', 'Noch 12 Sekunden');

  await sleep(6000);
  if (seq !== state.playSeq) return;
  phonePhase('«Ich habe jetzt eine klare Tendenz. Ich prüfe sie noch einmal kurz.»', 'Noch 6 Sekunden');

  await sleep(6000);
  if (seq !== state.playSeq) return;
  stopForeground();
  playCue('lifeline-ping');

  const packet = await resultPromise;
  if (packet.error) throw packet.error;
  const result = packet.result;
  modal(`
    <div class="joker-result-pop">
      <div class="phase-icon">☎</div>
      <h3>Der Tipp</h3>
      <div class="phone-process final-phone-tip">«Ich würde <strong>${escapeHtml(String(result.guessKey || '').toUpperCase())}</strong> nehmen. Ich bin ungefähr zu <strong>${Number(result.confidence || 0)}%</strong> sicher.»</div>
      <div class="modal-actions"><button class="btn primary" data-modal="close-joker">Zurück zur Frage</button></div>
    </div>`, true);
}

function phonePhase'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('usePhone block not found')
          s = s2

          # Winner / result screen
          pattern = re.compile(r"function finishGame\(won\) \{.*?\n\}\n\nasync function resultPrimary", re.S)
          replacement = r'''function finishGame(won) {
  if (!state.play || state.play.finished) return;
  state.play.finished = true;
  stopAll();
  stopHeartbeat();
  closeModal(true);

  let amountIndex;
  if (won) amountIndex = Math.min(state.play.index, 14);
  else if (state.play.index >= 10) amountIndex = 9;
  else if (state.play.index >= 5) amountIndex = 4;
  else amountIndex = -1;

  const card = document.querySelector('.result-card');
  const screen = document.querySelector('.result-screen');
  const finalWinner = won && amountIndex === 14;
  card?.classList.toggle('winner', won);
  card?.classList.toggle('million-winner', finalWinner);
  card?.classList.toggle('lost', !won);
  screen?.classList.toggle('winner-screen', won);
  document.querySelector('.winner-confetti')?.remove();

  if (won && card) {
    const confetti = document.createElement('div');
    confetti.className = 'winner-confetti';
    for (let i = 0; i < 34; i++) {
      const piece = document.createElement('span');
      piece.style.setProperty('--x', `${4 + Math.random() * 92}%`);
      piece.style.setProperty('--delay', `${Math.random() * 1.8}s`);
      piece.style.setProperty('--dur', `${2.3 + Math.random() * 2.1}s`);
      piece.style.setProperty('--rot', `${Math.floor(Math.random() * 360)}deg`);
      confetti.append(piece);
    }
    card.prepend(confetti);
  }

  const playerName = state.play.name && state.play.name !== 'Kandidat/in' ? state.play.name : '';
  $('#result-kicker').textContent = won ? (finalWinner ? '🏆 MILLIONÄR! 🏆' : '🏆 GESCHAFFT! 🏆') : 'Spiel beendet';
  $('#result-money').textContent = amountIndex >= 0 ? money[amountIndex] : '0 €';
  $('#result-copy').textContent = state.play.mode === 'student'
    ? (won ? `${playerName ? playerName + ', du' : 'Du'} hast das Spiel erfolgreich beendet!` : 'Danke fürs Mitspielen.')
    : (won ? `${playerName ? playerName + ' hat' : 'Der Kandidat oder die Kandidatin hat'} es geschafft!` : 'Die sichere Gewinnstufe.');
  $('#result-primary').textContent = state.play.mode === 'student' ? 'Zur Startseite' : 'Zurück zum Lehrermodus';
  showScreen('result');
  if (won) playCue('outro');
}

async function resultPrimary'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('finishGame block not found')
          s = s2
          app.write_text(s, encoding='utf-8')

          # Add hosting code presentation button
          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          old = '''            <div id="host-title" class="host-title"></div>\n            <div class="host-hint">Lernende wählen auf der Startseite den Lernendenmodus und geben diesen Code zusammen mit Name und Klasse ein.</div>'''
          new = '''            <div id="host-title" class="host-title"></div>\n            <button class="btn primary host-code-big-btn" data-action="host-code-big">Code gross anzeigen</button>\n            <div class="host-hint">Lernende wählen auf der Startseite den Lernendenmodus und geben diesen Code zusammen mit Name und Klasse ein.</div>'''
          if old not in h:
              raise SystemExit('host card anchor not found')
          h = h.replace(old, new, 1)
          index.write_text(h, encoding='utf-8')

          # Add explicit ping cue
          audio = Path('js/audio.js')
          a = audio.read_text(encoding='utf-8')
          old = '  "joker-teacher": ["assets/audio/lifeline-ping.mp3", { volume: .86 }],'
          new = '  "lifeline-ping": ["assets/audio/lifeline-ping.mp3", { volume: .90 }],\n  "joker-teacher": ["assets/audio/lifeline-ping.mp3", { volume: .86 }],'
          if old not in a:
              raise SystemExit('audio anchor not found')
          a = a.replace(old, new, 1)
          audio.write_text(a, encoding='utf-8')

          # Visual polish and viewport fit
          css = Path('styles-v3.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* WWM v3.1 gameplay polish */'
          if marker not in c:
              c += r'''

/* WWM v3.1 gameplay polish */
body{background:
  radial-gradient(circle at 76% 12%,rgba(66,75,225,.20),transparent 30%),
  radial-gradient(circle at 18% 78%,rgba(91,35,190,.16),transparent 32%),
  linear-gradient(145deg,#010219 0%,#07104f 52%,#11032d 100%)}
.teacher-nav .nav-card,.game-card-v3,.qstat,.metric{transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease}
.teacher-nav .nav-card:hover,.game-card-v3:hover,.qstat:hover{transform:translateY(-2px);border-color:rgba(255,157,47,.62);box-shadow:0 12px 32px rgba(0,0,25,.24)}
.teacher-section{background:linear-gradient(180deg,rgba(7,10,46,.88),rgba(3,5,29,.82));box-shadow:0 24px 72px rgba(0,0,20,.32),inset 0 1px 0 rgba(255,255,255,.025)}
.host-code-card{overflow:hidden;box-shadow:0 18px 48px rgba(0,0,24,.27),inset 0 1px 0 rgba(255,255,255,.04)}
.host-code-card::before{content:"";display:block;height:3px;margin:-22px -22px 18px;background:linear-gradient(90deg,#6f83ff,#ff9d2f,#8c54ff)}
.host-code-big-btn{width:100%;margin:2px 0 16px}

/* The complete game now stays inside the visible browser viewport. */
.game-screen.active{display:flex;flex-direction:column;height:100dvh;min-height:0;padding:10px 16px 12px;overflow:hidden}
.game-topbar{flex:0 0 auto;width:min(1740px,100%);margin:0 auto 5px;min-height:58px}
.mini-logo{width:68px;height:44px}.mini-brand{gap:10px}.mini-brand small{margin-top:1px}.game-mode-badge{margin-top:2px}
.game-layout{flex:1 1 auto;min-height:0;height:auto;width:min(1740px,100%);margin:0 auto;grid-template-columns:minmax(0,1fr) 250px;gap:16px;overflow:hidden}
.quiz-stage{min-height:0;justify-content:center;padding:9vh 0 4px}
.question-shell{width:96%;min-height:90px;margin:0 auto 10px;padding:16px 54px;font-size:clamp(19px,1.8vw,28px)}
.answers{gap:10px 14px}.answer{min-height:66px;padding:13px 28px 13px 66px;font-size:clamp(15px,1.18vw,20px)}.answer-letter{left:28px}
.answer-controls{margin-top:10px;min-height:40px}.game-status{min-height:20px;margin-top:5px;font-size:14px}
.game-sidebar{min-height:0;justify-content:center;gap:9px}.joker-row{gap:6px}.joker{min-height:48px;font-size:14px}
.money-ladder{padding:7px 8px;border-radius:17px}.money-step{min-height:24px;padding:1px 8px;font-size:12.5px;grid-template-columns:28px 1fr}

/* Fast, TV-like joker transitions */
.compact-joker-phase .audience-stage{min-height:220px}.compact-joker-phase .audience-live-bars{height:175px}
.joker-result-pop{animation:jokerPop .24s ease both}.phase-icon{text-align:center;font-size:42px;margin-bottom:6px}
.joker-countdown{text-align:center;font-size:15px}.joker-countdown strong{font-size:24px;color:#fff}
.final-phone-tip{min-height:130px}
@keyframes jokerPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* Large classroom code presentation */
.modal-card.wide:has(.code-presenter-modal){width:min(1180px,96vw);padding:22px;background:radial-gradient(circle at 50% 35%,#182078 0%,#090d44 42%,#040625 100%);border-color:rgba(255,157,47,.72)}
.code-presenter-modal{text-align:center;padding:28px 20px 18px}
.code-presenter-label{text-transform:uppercase;letter-spacing:.22em;color:#bec8ff;font-size:16px;font-weight:900}
.code-presenter-code{font-size:clamp(82px,13vw,190px);line-height:1;font-weight:1000;letter-spacing:.09em;color:#ffad45;text-shadow:0 0 32px rgba(255,157,47,.35);margin:18px 0}
.code-presenter-title{font-size:clamp(24px,3vw,42px);font-weight:900}.code-presenter-hint{margin-top:12px;color:#b9c2ef;font-size:16px}

/* Winner screen */
.result-screen{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 36%,rgba(98,61,255,.22),transparent 34%)}
.result-card{position:relative;overflow:hidden;isolation:isolate;transition:.3s ease}
.result-card.winner{width:min(880px,94vw);padding:42px 34px;border-color:rgba(255,197,90,.86);background:radial-gradient(circle at 50% 16%,rgba(255,176,67,.17),transparent 28%),linear-gradient(180deg,#12176e,#060832 72%);box-shadow:0 0 50px rgba(255,164,54,.20),0 28px 90px rgba(0,0,24,.55);animation:winnerCard .65s cubic-bezier(.2,.85,.25,1.2) both}
.result-card.winner::before{content:"🏆";display:grid;place-items:center;width:92px;height:92px;margin:0 auto 12px;border-radius:50%;font-size:48px;background:radial-gradient(circle,#ffdc86,#ec9022 66%,#9a4b0a);box-shadow:0 0 40px rgba(255,178,51,.38);position:relative;z-index:2}
.result-card.winner img{width:min(330px,62vw);box-shadow:0 0 32px rgba(102,74,255,.30)}
.result-card.winner .result-kicker{font-size:clamp(20px,3vw,34px);font-weight:1000;letter-spacing:.05em;color:#fff;margin-top:20px;text-shadow:0 0 22px rgba(255,255,255,.24)}
.result-card.winner .result-money{font-size:clamp(58px,9vw,112px);background:linear-gradient(180deg,#fff6cc,#ffb23e 72%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px rgba(255,166,48,.25))}
.result-card.million-winner{border-width:2px}.result-card.million-winner::after{content:"";position:absolute;inset:-45%;z-index:-1;background:repeating-conic-gradient(from 0deg,rgba(255,207,101,.12) 0 5deg,transparent 5deg 14deg);animation:winnerSpin 18s linear infinite}
.winner-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}.winner-confetti span{position:absolute;left:var(--x);top:-18px;width:8px;height:16px;border-radius:2px;background:#ffb13f;transform:rotate(var(--rot));animation:confettiFall var(--dur) linear var(--delay) infinite}.winner-confetti span:nth-child(3n){background:#8b7cff}.winner-confetti span:nth-child(3n+1){background:#f8f8ff}.winner-confetti span:nth-child(4n){width:6px;height:10px;border-radius:50%;background:#37d884}
.result-card.winner>*:not(.winner-confetti){position:relative;z-index:2}
@keyframes winnerCard{from{opacity:0;transform:scale(.88) translateY(18px)}to{opacity:1;transform:none}}
@keyframes winnerSpin{to{transform:rotate(360deg)}}
@keyframes confettiFall{0%{transform:translateY(-30px) rotate(var(--rot));opacity:0}10%{opacity:1}100%{transform:translateY(760px) rotate(720deg);opacity:.9}}

@media(max-height:900px) and (min-width:721px){
  .game-screen.active{padding:6px 12px 8px}.game-topbar{min-height:50px}.mini-logo{width:58px;height:38px}
  .game-layout{grid-template-columns:minmax(0,1fr) 230px;gap:12px}.quiz-stage{padding-top:5vh}
  .question-shell{min-height:76px;padding:12px 48px;margin-bottom:8px;font-size:clamp(17px,1.65vw,24px)}
  .answers{gap:8px 12px}.answer{min-height:56px;padding-top:10px;padding-bottom:10px;font-size:clamp(14px,1.05vw,18px)}
  .answer-controls{margin-top:7px}.game-status{margin-top:2px}.joker{min-height:42px}.money-step{min-height:21px;font-size:11.5px}.money-ladder{padding:5px 7px}
}

@media(max-width:900px){.game-screen.active{height:auto;min-height:100vh;overflow:visible}.game-layout{overflow:visible}.quiz-stage{padding-top:30px}}
'''
              css.write_text(c, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check js/app-v3.js && node --check js/audio.js && node --check js/backend-v3.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app-v3.js js/audio.js styles-v3.css
          git diff --cached --quiet && exit 0
          git commit -m "Polish WWM layout jokers winner and hosting code"
          git push
