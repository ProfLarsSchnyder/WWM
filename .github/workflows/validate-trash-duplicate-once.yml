name: Validate trash duplicate fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-trash-duplicate-once.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check js/app-core-v3.js
          node --check js/app-v3.js
