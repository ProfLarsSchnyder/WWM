name: Extend joker audio segments once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extend-joker-audio-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend audience and phone segments
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/app-v3.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ("playCueSegment('joker-audience', 26, 32)", "playCueSegment('joker-audience', 26, 33)"),
              ('<strong>6</strong> Sekunden', '<strong>7</strong> Sekunden'),
              ('for (let remaining = 6; remaining >= 1; remaining--)', 'for (let remaining = 7; remaining >= 1; remaining--)'),
              ("playCueSegment('joker-phone', 20, 38)", "playCueSegment('joker-phone', 20, 39)"),
              ('phonePhase(thoughtFor(18), 18);', 'phonePhase(thoughtFor(19), 19);'),
              ('for (let remaining = 18; remaining >= 1; remaining--)', 'for (let remaining = 19; remaining >= 1; remaining--)'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check js/app-v3.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-v3.js
          git commit -m "Extend joker audio segments by one second"
          git push
