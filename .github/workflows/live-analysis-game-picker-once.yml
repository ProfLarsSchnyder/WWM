name: Live analysis game picker once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-analysis-game-picker-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live analysis picker update
        run: python .github/scripts/live_analysis_game_picker.py
      - name: Check JavaScript
        run: |
          node --check js/app-v3.js
          node --check js/backend-v3.js
      - name: Commit changes
        run: |
          git config user.name "ProfLarsSchnyder"
          git config user.email "lars.schnyder1@gmail.com"
          git add js/app-v3.js js/backend-v3.js index.html
          git commit -m "Add game picker to live analysis"
          git push
